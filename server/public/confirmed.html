<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0c1016">
<title>Orchem · Confirmed</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="fonts/bricolage-grotesque-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body data-state="watching">

<header class="top">
  <div class="top-row">
    <a class="brand" href="/" aria-label="Orchem home">
      <svg class="brand-mark" viewBox="0 0 160 160" fill="none" aria-hidden="true">
        <path d="M 72 24.6 A 56 56 0 0 0 72 135.4" stroke="#E8ECEF" stroke-width="10" stroke-linecap="round"/>
        <path d="M 88 24.6 A 56 56 0 0 1 88 135.4" stroke="#E8ECEF" stroke-width="10" stroke-linecap="round"/>
        <line x1="80" y1="8" x2="80" y2="152" stroke="#34D399" stroke-width="6" stroke-linecap="round"/>
        <rect x="66" y="58" width="28" height="44" rx="3" fill="#34D399"/>
      </svg>
      <span class="brand-word">ORCHEM</span>
    </a>
    <div class="status" role="status">
      <span class="dot" id="led-status"></span>
      <span id="status-text">Connecting</span>
    </div>
  </div>
  <nav class="tabs" aria-label="Pages">
    <a class="tab" href="/">Watchlist</a>
    <a class="tab" href="/confirmed.html" id="confirmed-link" aria-current="page">Confirmed <span class="tab-badge" id="confirmed-badge">0</span></a>
    <a class="tab" href="/#logbook">Logbook</a>
  </nav>
</header>

<main class="shell">

  <section class="hero" aria-live="polite">
    <h1 class="hero-title" id="hero-title">Loading…</h1>
    <p class="hero-sub" id="hero-sub"></p>
    <div class="hero-pnl" id="hero-pnl" hidden>
      <span class="hero-pnl-value" id="pnl-total"></span>
      <span class="hero-pnl-sub" id="pnl-sub"></span>
    </div>
    <div class="break-line" aria-hidden="true"><i></i></div>
  </section>

  <section class="section" style="margin-top:8px">
    <div class="tickets" id="confirmed-list"></div>
  </section>

</main>

<footer class="foot">
  <span>Every entry confirmed since the watchlist last reset at 01:00 Lagos time: the candle, entry, TP and SL, size, and what Bybit did with it.</span>
  <a href="/">Back to the watchlist</a>
</footer>

<script src="ui.js"></script>
<script src="confirmed.js"></script>
</body>
</html>
