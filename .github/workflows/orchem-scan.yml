name: Orchem Bot Scan

on:
  schedule:
    # Every 30 minutes, UTC — matches the 30min confirmation window.
    # GitHub may delay this by a few minutes under load — normal, fine here.
    - cron: '*/30 * * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab, for testing

permissions:
  contents: write # needed to commit state.json back to the repo

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run scan
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        run: node scan.mjs

      - name: Commit updated state
        run: |
          git config user.name "orchem-bot"
          git config user.email "orchem-bot@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update bot state [skip ci]"
          git push
